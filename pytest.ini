[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Live tests against a real Photos library. Deselect with -m "not photos_live".
# The fixture in tests/conftest.py refuses to run unless the library Photos.app
# has open is named KaMeRa-Test — that name check is the interlock that stops a
# careless `pytest` writing keywords into a real library.
markers =
    photos_live: needs Photos.app open on ~/Pictures/KaMeRa-Test.photoslibrary
